<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F5EF;
    --panel: #FFFFFF;
    --ink: #1F2A22;
    --ink-soft: #5B6A5D;
    --line: #DEDACB;
    --leaf: #4C6B4F;
    --leaf-dark: #35492F;
    --citrus: #E2793D;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Work Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 440px;
    margin: 0 auto;
    padding: 72px 24px 96px;
  }

  header.page-head {
    margin-bottom: 32px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 24px;
    text-align: center;
  }

  header.page-head h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 2.1rem;
    margin: 0 0 8px;
    line-height: 1.05;
  }

  header.page-head p {
    margin: 0 auto;
    color: var(--ink-soft);
    font-size: 0.96rem;
    max-width: 34ch;
  }

  form {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 32px;
  }

  .field { margin-bottom: 22px; }
  .field:last-of-type { margin-bottom: 0; }

  label {
    display: block;
    font-size: 0.85rem;
    font-weight: 500;
    margin-bottom: 8px;
  }

  label .hint {
    font-weight: 400;
    color: var(--ink-soft);
  }

  input[type="text"],
  input[type="email"],
  input[type="password"] {
    width: 100%;
    font-family: 'Work Sans', sans-serif;
    font-size: 0.96rem;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 12px 14px;
  }

  input:focus {
    outline: 2px solid var(--citrus);
    outline-offset: 1px;
    border-color: var(--citrus);
  }

  .password-hint {
    margin-top: 6px;
    font-size: 0.8rem;
    color: var(--ink-soft);
  }

  .form-actions {
    margin-top: 30px;
    padding-top: 24px;
    border-top: 1px solid var(--line);
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    text-decoration: none;
    font-family: 'Work Sans', sans-serif;
    font-size: 0.96rem;
    font-weight: 500;
    padding: 13px 22px;
    border-radius: 3px;
    border: 1px solid transparent;
    cursor: pointer;
    transition: background-color 0.15s ease;
  }

  .btn-primary {
    background: var(--leaf);
    color: #fff;
  }
  .btn-primary:hover { background: var(--leaf-dark); }

  .switch-link {
    text-align: center;
    margin-top: 22px;
    font-size: 0.88rem;
    color: var(--ink-soft);
  }

  .switch-link a {
    color: var(--leaf-dark);
    font-weight: 500;
    text-decoration: none;
  }
  .switch-link a:hover { text-decoration: underline; }

  footer.note {
    margin-top: 28px;
    font-size: 0.82rem;
    color: var(--ink-soft);
    line-height: 1.6;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header class="page-head">
      <h1>Create an account</h1>
      <p>Sign up to start managing your fruit list.</p>
    </header>

    <form action="#" method="get" id="form">
      <div id="error"></div>
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="e.g. fruitfan22" autocomplete="username" required>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com"  autocomplete="email" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="At least 8 characters" minlength="8" autocomplete="current-password" required>
        <p class="password-hint">Use 8 or more characters with a mix of letters and numbers.</p>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Sign up</button>
      </div>
    </form>

    <p class="switch-link">Already have an account? <a href="login.html">Log in</a></p>

    <footer class="note">
      This form has no backend attached, so submitting won't create a real account yet. Connect it to a server to handle sign-ups.
    </footer>
  </div>
  
  <script src="signup.js"></script>
</body>
</html>
